name: Promote qualified containers
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful candidate build run ID on this same commit
        required: true
      arm64_run:
        description: Successful ARM64 qualification run ID
        required: true
      amd64_run:
        description: Successful AMD64 qualification run ID
        required: true
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: container-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ${{ vars.IMAGE_AMD64_RUNNER || 'ubuntu-24.04' }}
    environment: container-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download successful build and qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          ARM64_RUN: ${{ inputs.arm64_run }}
          AMD64_RUN: ${{ inputs.amd64_run }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for key, workflow, pattern, dest in [
              ('CANDIDATE_RUN', 'images.yml', 'candidate-*', 'candidates'),
              ('ARM64_RUN', 'image-qualify.yml', 'gpu-evidence-arm64', 'evidence/arm64'),
              ('AMD64_RUN', 'image-qualify.yml', 'gpu-evidence-amd64', 'evidence/amd64')]:
              run = os.environ[key]
              assert run.isdecimal()
              r = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/actions/runs/{run}']))
              assert r['head_sha'] == os.environ['GITHUB_SHA'] and r['conclusion'] == 'success'
              assert r['event'] == 'workflow_dispatch' and r['path'] == f'.github/workflows/{workflow}'
              subprocess.run(['gh', 'run', 'download', run, '--pattern', pattern, '--dir', dest], check=True)
          PY
      - name: Validate all digests and evidence, then promote
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 tools/release/images.py promote --candidates candidates --evidence evidence \
            --revision "$GITHUB_SHA" --namespace "${OWNER,,}" --publish

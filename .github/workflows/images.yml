name: Container candidates
on:
  pull_request:
    paths: ['docker/**', 'kvcached/**', 'csrc/**', 'setup.py', 'pyproject.toml', '.dockerignore', '.github/workflows/image*.yml', 'tools/release/**', 'tests/e2e/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        engine: [vllm, sglang]
        arch: [amd64, arm64]
    # Override with native large-disk hosted runner labels if necessary.
    # Do not configure a privileged self-hosted runner for untrusted PRs.
    runs-on: ${{ matrix.arch == 'arm64' && (vars.IMAGE_ARM64_RUNNER || 'ubuntu-24.04-arm') || (vars.IMAGE_AMD64_RUNNER || 'ubuntu-24.04') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native runner and disk
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$(test "$ARCH" = arm64 && echo aarch64 || echo x86_64)"
          # These CUDA base images exceed the free space of many standard runners.
          test "$(df --output=avail -BG . | tail -1 | tr -dc '0-9')" -ge 100 || {
            echo 'Configure IMAGE_AMD64_RUNNER / IMAGE_ARM64_RUNNER with >=100 GiB free disk.'
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - name: Image coordinates
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          ENGINE: ${{ matrix.engine }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/kvcached-$ENGINE:candidate-$GITHUB_SHA-$ARCH" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.engine }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.image }}
          # Single-platform digest simplifies immutable GPU qualification.
          provenance: false
          sbom: false
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Record candidate digest
        if: github.event_name == 'workflow_dispatch'
        env:
          ENGINE: ${{ matrix.engine }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          e, a = os.environ['ENGINE'], os.environ['ARCH']
          with open(f'candidate-{e}-{a}.json', 'w') as f:
              json.dump(dict(engine=e, architecture=a, revision=os.environ['GITHUB_SHA'], digest=os.environ['DIGEST']), f)
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: candidate-${{ matrix.engine }}-${{ matrix.arch }}
          path: candidate-*.json
          if-no-files-found: error
          retention-days: 30
